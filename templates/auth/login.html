{% extends "base.html" %}

{% block title %}Login | MULTI{% endblock %}

{% block content %}

<section class="auth">

    <form
        id="loginForm"
        class="auth-card"
        novalidate
    >

        <span class="eyebrow">
            WELCOME BACK
        </span>

        <h1>
            Login to MULTI
        </h1>

        <p class="muted">
            Login to access your disease risk prediction
            dashboard.
        </p>


        <!-- Account Role -->

        <div class="role-switch">

            <label>

                <input
                    type="radio"
                    name="role"
                    value="user"
                    checked
                >

                User

            </label>


            <label>

                <input
                    type="radio"
                    name="role"
                    value="admin"
                >

                Admin

            </label>

        </div>


        <!-- Email -->

        <label for="email">
            Email
        </label>

        <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >


        <!-- Login Button -->

        <button
            type="submit"
            class="btn primary full"
        >

            <i class="fa-solid fa-right-to-bracket"></i>

            Login

        </button>


        <p class="center">

            New user?

            <a href="{{ url_for('register') }}">
                Create account
            </a>

        </p>

    </form>

</section>

{% endblock %}
