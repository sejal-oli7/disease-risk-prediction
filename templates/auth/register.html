{% extends "base.html" %}

{% block title %}Register | MULTI{% endblock %}

{% block content %}

<section class="auth">

    <form
        id="registerForm"
        class="auth-card"
    >

        <span class="eyebrow">
            GET STARTED
        </span>

        <h1>
            Create Account
        </h1>

        <p class="muted">
            Create your MULTI account to start using
            disease risk prediction services.
        </p>


        <!-- Name -->

        <label for="name">
            Full Name
        </label>

        <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your full name"
            required
        >


        <!-- Email -->

        <label for="email">
            Email
        </label>

        <input
            id="email"
            name="email"
            type="email"
            placeholder="you@example.com"
            required
        >


        <!-- Password -->

        <label for="password">
            Password
        </label>

        <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            minlength="6"
            required
        >


        <!-- Register Button -->

        <button
            type="submit"
            class="btn primary full"
        >
            <i class="fa-solid fa-user-plus"></i>
            Create Account
        </button>


        <p class="center">

            Already registered?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </form>

</section>

{% endblock %}
